[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "agent-coordination-integrity"
version = "0.1.0"
description = "Independent verification for multi-agent coordination evidence"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["cryptography>=43,<47", "typer>=0.12,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "hypothesis>=6.100,<7", "ruff>=0.9,<1", "mypy>=1.13,<2", "build>=1.2,<2"]

[project.scripts]
aci = "aci.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/aci"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
